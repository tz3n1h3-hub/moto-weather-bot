services:
  - type: web
    name: moto-weather-bot
    runtime: python
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python -u bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MY_BOT_USERNAME
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"